    // Function to convert hex to RGB
    function hexToRgb(hex) {
        hex = hex.replace('#', '');
        const bigint = parseInt(hex, 16);
        const r = (bigint >> 16) & 255;
        const g = (bigint >> 8) & 255;
        const b = bigint & 255;
        return [r, g, b];
    }

    // Function to convert RGB to HSL
    function rgbToHsl(r, g, b) {
        r /= 255;
        g /= 255;
        b /= 255;

        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;

        if (max === min) {
            h = s = 0; // achromatic
        } else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }

        return [h * 360, s * 100, l * 100];  // HSL values
    }

    // Function to lighten/darken HSL color
    function adjustLightness(h, s, l, amount) {
        l = l + amount; // Adjust lightness by the given amount
        l = Math.min(Math.max(0, l), 100); // Clamp lightness to 0-100
        return `hsl(${h}, ${s}%, ${l}%)`;
    }

    // Function to get lighter and darker variants of a color
    function getColorVariants(hexColor, lightnessAdjustment = 15) {
      // Convert hex to RGB
      const rgb = hexToRgb(hexColor);
      
      // Convert RGB to HSL
      const [h, s, l] = rgbToHsl(...rgb);

      // Calculate variants by adjusting the lightness
      const lightVariant = adjustLightness(h, s, l, lightnessAdjustment);        // Lighten by lightnessAdjustment
      const lighterVariant = adjustLightness(h, s, l, lightnessAdjustment * 2);  // More lightened
      const lightestVariant = adjustLightness(h, s, l, lightnessAdjustment * 3);  // Maximum lightened

      const darkVariant = adjustLightness(h, s, l, -lightnessAdjustment);         // Darken by lightnessAdjustment
      const darkerVariant = adjustLightness(h, s, l, -(lightnessAdjustment * 2)); // More darkened
      const darkestVariant = adjustLightness(h, s, l, -(lightnessAdjustment * 3)); // Maximum darkened

      return {
          light: lightVariant,
          lighter: lighterVariant,
          lightest: lightestVariant,
          dark: darkVariant,
          darker: darkerVariant,
          darkest: darkestVariant
      };
  }
    // Function to retrieve a color from the CSS variables
    function getCssVarColor(varName) {
        return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
